                "Д.29 Нагар, копоть на стенах (места протравки)*",
                "Д.30 Плесень, следы протечек",
                "Е.31 Ванная: ванна, смесители, кафель",
                "Е.32 Туалет: унитаз, ниша под жалюзи",
                "Е.33 Точки стояков отопления"
            ]}
        };

        let db;
        const dbReq = indexedDB.open("okv_stable_db_v16", 1);
        dbReq.onupgradeneeded = e => {
            e.target.result.createObjectStore("files", {keyPath: "key"});
        };
        dbReq.onsuccess = e => { db = e.target.result; renderApp(); };

        function renderApp() {
            const tabsContainer = document.getElementById("tabs-container");
            const container = document.getElementById("apartments-container");
            tabsContainer.innerHTML = "";
            container.innerHTML = "";
            
            Object.keys(apts).forEach((num, index) => {
                const data = apts[num];
                const activeClass = index === 0 ? "active" : "";
                
                tabsContainer.innerHTML += `<button class="tab-btn ${activeClass}" id="tab-${num}" onclick="switchApt('${num}')">Кв. ${num}</button>`;
                
                let html = `<div class="apt-content ${activeClass}" id="content-${num}">
                    <div class="card">
                        <div style="font-weight:bold;font-size:16px;color:#007bff;margin-bottom:4px;">Квартира № ${num}</div>
                        <div class="apt-info">📍 ${data.addr}<br>📏 Базовая высота потолков: ${data.h}</div>`;
                
                data.rooms.forEach(r => {
                    html += `<div class="room-block">
                        <div class="room-title">
                            <span>🏠 ${r.name}</span>
                            <span style="font-size:11px;color:#6c757d;">План: ${r.p} м</span>
                        </div>
                        <div class="grid-inputs">
                            <div>
                                <label>Фактический периметр (м)</label>
                                <input type="number" step="0.01" id="f-${num}-${r.id}-p" placeholder="0.00" oninput="calculateDelta('${num}','${r.id}','${r.p}',this.value)">
                                <span id="d-${num}-${r.id}-p" class="delta-indicator delta-zero">Δ: —</span>
                            </div>
                            <div>
                                <label>Покрытие пола</label>
                                <select id="f-${num}-${r.id}-floor" onchange="saveText(this.id, this.value)">
                                    <option value="${r.f}">${r.f}</option>
                                    <option value="ламинат">ламинат</option>
                                    <option value="линолеум">линолеум</option>
                                    <option value="плитка">плитка</option>
                                    <option value="—">—</option>
                                </select>
                            </div>
                        </div>
                        <div class="media-container">
                            <div class="file-btn">
                                📷 Добавить фото
                                <input type="file" accept="image/*" multiple capture="environment" onchange="processPhotos(this, '${num}', '${r.id}')">
                            </div>
                            <div class="media-actions">
                                <button class="btn btn-danger" style="padding:4px 8px;font-size:10px;" onclick="deleteSelectedPhotos('${num}','${r.id}')">🗑 Удалить выбранные</button>
                            </div>
                            <div class="media-box" id="box-${num}-${r.id}"></div>
                        </div>
                    </div>`;
                });

                html += `<div class="checklist-v15">
                    <div class="checklist-header">
                        <span>📋 ЧЕК-ЛИСТ ОСМОТРА И ДЕФЕКТОВКИ</span>
                        <span id="progress-${num}" style="color:#856404;font-weight:bold;">Прогресс: 0%</span>
                    </div>
                    <div class="check-scroll-box">`;
                
                data.checklist.forEach((item, cIdx) => {
                    const isMandatory = item.includes('*') ? 'mandatory' : '';
                    html += `<div class="check-row ${isMandatory}">
                        <div class="check-text">${item}</div>
                        <select id="ch-${num}-${cIdx}" class="status-select" onchange="saveCheckStatus('${num}', this.id, this.value)">
                            <option value="">-</option>
                            <option value="ok" style="color:#28a745;">✓ Норма</option>
                            <option value="fail" style="color:#dc3545;">✗ Дефект</option>
                        </select>
                    </div>`;
                });

                html += `</div>
                    <textarea placeholder="Общие примечания технадзора, дефекты лаг, разводки..." id="notes-${num}" oninput="saveText(this.id, this.value)" style="margin-top:8px;height:50px;font-size:12px;resize:none;"></textarea>
                </div></div></div>`;
                
                container.innerHTML += html;
            });
            
            restoreTextFields();
            loadBlobsPreviews();
            updateAllProgressIndicators();
        }

        function switchApt(num) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.apt-content').forEach(c => c.classList.remove('active'));
            document.getElementById(`tab-${num}`).classList.add('active');
            document.getElementById(`content-${num}`).classList.add('active');
        }

        function saveText(id, val) { 
            localStorage.setItem(id, val); 
        }

        function calculateDelta(num, roomId, planVal, factVal) {
            saveText(`f-${num}-${roomId}-p`, factVal);
            const indicator = document.getElementById(`d-${num}-${roomId}-p`);
            if (!factVal || isNaN(factVal)) {
                indicator.innerText = "Δ: —";
                indicator.className = "delta-indicator delta-zero";
                return;
            }
            const diff = (parseFloat(factVal) - parseFloat(planVal)).toFixed(2);
            if (parseFloat(diff) === 0) {
                indicator.innerText = `Δ: 0.00`;
                indicator.className = "delta-indicator delta-zero";
            } else if (parseFloat(diff) > 0) {
                indicator.innerText = `Δ: +${diff}`;
                indicator.className = "delta-indicator delta-plus";
            } else {
                indicator.innerText = `Δ: ${diff}`;
                indicator.className = "delta-indicator delta-minus";
            }
        }

        function saveCheckStatus(num, id, val) {
            saveText(id, val);
            updateProgress(num);
        }

        function updateProgress(num) {
            const total = apts[num].checklist.length;
            let checked = 0;
            for(let i=0; i<total; i++) {
                if(localStorage.getItem(`ch-${num}-${i}`)) checked++;
            }
            const pct = Math.round((checked / total) * 100);
            document.getElementById(`progress-${num}`).innerText = `Прогресс: ${checked}/${total} (${pct}%)`;
        }

        function updateAllProgressIndicators() {
            Object.keys(apts).forEach(num => updateProgress(num));
        }

        function restoreTextFields() {
            document.querySelectorAll('input, select, textarea').forEach(el => {
                const v = localStorage.getItem(el.id);
                if (v !== null) {
                    el.value = v;
                    if (el.id.endsWith('-p') && !el.id.startsWith('ch-')) {
                        const parts = el.id.split('-');
                        const num = parts[1];
                        const rId = parts[2];
                        const planObj = apts[num].rooms.find(r => r.id === rId);
                        if(planObj) calculateDelta(num, rId, planObj.p, v);
                    }
                }
            });
        }

        function processPhotos(input, num, roomId) {
            if(!input.files || input.files.length === 0) return;
            const tx = db.transaction("files", "readwrite");
            const store = tx.objectStore("files");
            
            Array.from(input.files).forEach(file => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        let w = img.width, h = img.height;
                        if(w > 1600) { h = Math.round((h * 1600) / w); w = 1600; }
                        canvas.width = w; canvas.height = h;
                        
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, w, h);
                        
                        ctx.fillStyle = "rgba(255, 204, 0, 0.9)";
                        ctx.font = "bold 26px sans-serif";
                        const time = new Date().toLocaleString('ru-RU');
                        ctx.fillText(`Кв.${num} · ${roomId} · ${time}`, 20, h - 25);
                        
                        canvas.toBlob(blob => {
                            const key = `img-${num}-${roomId}-${Date.now()}-${Math.floor(Math.random()*1000)}`;
                            store.put({ key, data: blob });
                        }, 'image/jpeg', 0.85);
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
            
            tx.oncomplete = () => { setTimeout(loadBlobsPreviews, 500); };
        }

        function loadBlobsPreviews() {
            if(!db) return;
            document.querySelectorAll('.media-box').forEach(box => box.innerHTML = "");
            
            db.transaction("files", "readonly").objectStore("files").openCursor().onsuccess = e => {
                const cursor = e.target.result;
                if(cursor) {
                    const k = cursor.value.key;
                    const parts = k.split('-');
                    const num = parts[1];
                    const roomId = parts[2];
                    const targetBox = document.getElementById(`box-${num}-${roomId}`);
                    if(targetBox) {
                        const div = document.createElement('div');
                        div.className = 'media-item';
                        div.dataset.key = k;
                        div.onclick = () => div.classList.toggle('selected');
                        
                        const img = document.createElement('img');
                        img.className = 'media-preview';
                        img.src = URL.createObjectURL(cursor.value.data);
                        
                        div.appendChild(img);
                        targetBox.appendChild(div);
                    }
                    cursor.continue();
                }
            };
        }

        function deleteSelectedPhotos(num, roomId) {
            const targetBox = document.getElementById(`box-${num}-${roomId}`);
            const selected = targetBox.querySelectorAll('.media-item.selected');
            if(selected.length === 0) { alert("Сначала выберите фотографии кликом!"); return; }
            
            const tx = db.transaction("files", "readwrite");
            const store = tx.objectStore("files");
            selected.forEach(div => store.delete(div.dataset.key));
            tx.oncomplete = () => loadBlobsPreviews();
        }

        function exportTextDataBackup() {
            try {
                const backup = { version: "v15.6-text-only", date: new Date().toISOString(), payload: JSON.stringify(localStorage) };
                const blob = new Blob([JSON.stringify(backup, null, 2)], {type: 'application/json'});
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `OKV_TEXT_BACKUP_${new Date().toISOString().slice(0,10)}.json`;
                document.body.appendChild(link); link.click(); link.remove();
            } catch (err) { alert("Ошибка бэкапа: " + err.message); }
        }

        function clearAllData() {
            if(confirm("ВНИМАНИЕ: Все замеры, чеклисты и фотографии будут безвозвратно удалены! Очистить?")) {
                localStorage.clear();
                const tx = db.transaction("files", "readwrite");
                tx.objectStore("files").clear();
                tx.oncomplete = () => { alert("База данных успешно обнулена!"); location.reload(); };
            }
        }

        // Высокотехнологичный экспорт в формат SpreadsheetML (Excel XML) с поддержкой листов и стилей отклонений
        function exportToExcel() {
            let xml = `<?xml version="1.0" encoding="UTF-8"?>
<?mso-application progid="Excel.Sheet"?>
<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet"
 xmlns:o="urn:schemas-microsoft-com:office:spreadsheet"
 xmlns:x="urn:schemas-microsoft-com:office:excel"
 xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet"
 xmlns:html="http://www.w3.org/TR/REC-html40">
 <Styles>
  <Style ss:ID="Default" ss:Name="Normal">
   <Alignment ss:Vertical="Bottom"/>
   <Borders/>
   <Font ss:FontName="Calibri" x:CharSet="204" x:Family="Swiss" ss:Size="11" ss:Color="#000000"/>
   <Interior/>
   <NumberFormat/>
   <Protection/>
  </Style>
  <Style ss:ID="Header">
   <Font ss:FontName="Calibri" x:CharSet="204" ss:Size="11" ss:Color="#FFFFFF" ss:Bold="1"/>
   <Interior ss:Color="#007bff" ss:Pattern="Solid"/>
  </Style>
  <Style ss:ID="Title">
   <Font ss:FontName="Calibri" x:CharSet="204" ss:Size="14" ss:Bold="1"/>
  </Style>
  <Style ss:ID="DeltaPlus">
   <Interior ss:Color="#C6EFCE" ss:Pattern="Solid"/>
   <Font ss:Color="#006100"/>
  </Style>
  <Style ss:ID="DeltaMinus">
   <Interior ss:Color="#FFC7CE" ss:Pattern="Solid"/>
   <Font ss:Color="#9C0006"/>
  </Style>
 </Styles>`;

            // Сначала соберем все ключи медиа, чтобы сопоставить фото с комнатами
            let mediaKeys = [];
            const req = db.transaction("files", "readonly").objectStore("files").getAllKeys();
            req.onsuccess = () => {
                mediaKeys = req.result;
                generateExcelPayload(xml, mediaKeys);
            };
        }

        function generateExcelPayload(xml, mediaKeys) {
            Object.keys(apts).forEach(num => {
                const data = apts[num];
                xml += `<Worksheet ss:Name="Кв. ${num} замеры">
   <Table ss:ExpandedColumnCount="7" ss:ExpandedRowCount="${data.rooms.length + 4}" x:FullColumns="1" x:FullRows="1">
    <Column ss:Width="160"/>
    <Column ss:Width="80"/>
    <Column ss:Width="80"/>
    <Column ss:Width="80"/>
    <Column ss:Width="100"/>
    <Column ss:Width="100"/>
    <Column ss:Width="250"/>
    <Row ss:Height="24">
     <Cell ss:StyleID="Title"><Data ss:Type="String">Ведомость замеров квартиры № ${num}</Data></Cell>
    </Row>
    <Row><Cell><Data ss:Type="String">Адрес: ${data.addr}</Data></Cell></Row>
    <Row/>
    <Row ss:StyleID="Header">
     <Cell><Data ss:Type="String">Помещение</Data></Cell>
     <Cell><Data ss:Type="String">Параметр</Data></Cell>
     <Cell><Data ss:Type="String">План БТИ</Data></Cell>
     <Cell><Data ss:Type="String">Факт замера</Data></Cell>
     <Cell><Data ss:Type="String">Дельта (Δ)</Data></Cell>
     <Cell><Data ss:Type="String">Пол</Data></Cell>
     <Cell><Data ss:Type="String">Имена фото/медиа</Data></Cell>
    </Row>`;

                data.rooms.forEach(r => {
                    const factVal = localStorage.getItem(`f-${num}-${r.id}-p`) || "";
                    const floorVal = localStorage.getItem(`f-${num}-${r.id}-floor`) || r.f;
                    
                    let deltaStr = "0.00";
                    let styleId = "Default";
                    if(factVal && !isNaN(factVal)) {
                        let diff = (parseFloat(factVal) - parseFloat(r.p)).toFixed(2);
                        if(parseFloat(diff) > 0) { deltaStr = `+${diff}`; styleId = "DeltaPlus"; }
                        else if(parseFloat(diff) < 0) { deltaStr = `${diff}`; styleId = "DeltaMinus"; }
                    } else { deltaStr = "—"; }

                    let photos = [];
                    mediaKeys.forEach(k => {
                        if(k.startsWith(`img-${num}-${r.id}-`)) photos.push(`${k}.jpg`);
                    });
                    let photoStr = photos.length > 0 ? photos.join(", ") : "нет фото";

                    xml += `<Row>
     <Cell><Data ss:Type="String">${r.name}</Data></Cell>
     <Cell><Data ss:Type="String">Периметр</Data></Cell>
     <Cell><Data ss:Type="Number">${r.p}</Data></Cell>
     <Cell><Data ss:Type="${factVal ? 'Number' : 'String'}">${factVal || '—'}</Data></Cell>
     <Cell ss:StyleID="${styleId}"><Data ss:Type="String">${deltaStr}</Data></Cell>
     <Cell><Data ss:Type="String">${floorVal}</Data></Cell>
     <Cell><Data ss:Type="String">${photoStr}</Data></Cell>
    </Row>`;
                });
                xml += `</Table></Worksheet>`;

                // Лист детального чеклиста
                xml += `<Worksheet ss:Name="Кв. ${num} чеклист">
   <Table ss:ExpandedColumnCount="3" ss:ExpandedRowCount="${data.checklist.length + 3}" x:FullColumns="1" x:FullRows="1">
    <Column ss:Width="350"/>
    <Column ss:Width="100"/>
    <Column ss:Width="300"/>
    <Row><Cell ss:StyleID="Title"><Data ss:Type="String">Чек-лист контроля дефектов Кв. ${num}</Data></Cell></Row>
    <Row/>
    <Row ss:StyleID="Header">
     <Cell><Data ss:Type="String">Пункт проверки</Data></Cell>
     <Cell><Data ss:Type="String">Статус</Data></Cell>
     <Cell><Data ss:Type="String">Полевые заметки</Data></Cell>
    </Row>`;

                data.checklist.forEach((item, cIdx) => {
                    const status = localStorage.getItem(`ch-${num}-${cIdx}`) || "Не проверено";
                    const statusText = status === "ok" ? "✓ Норма" : (status === "fail" ? "✗ Дефект" : "—");
                    const notes = (cIdx === data.checklist.length - 1) ? (localStorage.getItem(`notes-${num}`) || "") : "";
                    
                    xml += `<Row>
     <Cell><Data ss:Type="String">${item}</Data></Cell>
     <Cell><Data ss:Type="String">${statusText}</Data></Cell>
     <Cell><Data ss:Type="String">${notes}</Data></Cell>
    </Row>`;
                });
                xml += `</Table></Worksheet>`;
            });

            xml += `</Workbook>`;
            
            const blob = new Blob([xml], {type: "application/vnd.ms-excel;charset=utf-8"});
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `ОТЧЕТ_ОСМОТРА_СЕВЕРОМОРСК_${new Date().toISOString().slice(0,10)}.xls`;
            document.body.appendChild(link); link.click(); link.remove();
        }
    </script>
</body>
</html>
